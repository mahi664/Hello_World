name: Build macOS ARM64 Python 3.9 wheelhouse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create requirements file
        run: |
          cat > requirements.txt <<'EOF'
          fastapi==0.119.0
          uvicorn[standard]==0.37.0
          EOF
          mkdir -p wheelhouse
          cat requirements.txt

      - name: Download macOS ARM64 CPython 3.9 wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip download \
            --only-binary=:all: \
            --dest wheelhouse \
            --platform macosx_11_0_arm64 \
            --platform macosx_10_9_universal2 \
            --python-version 39 \
            --implementation cp \
            --abi cp39 \
            --abi abi3 \
            --abi none \
            -r requirements.txt

      - name: Add target manifest
        run: |
          {
            echo "Target: macOS ARM64"
            echo "Python: CPython 3.9"
            echo "Architecture: arm64"
          } > wheelhouse/BUILD-INFO.txt

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-py39-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
