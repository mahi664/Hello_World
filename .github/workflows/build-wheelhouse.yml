name: Build macOS ARM64 Python 3.9 wheelhouse

on:
  workflow_dispatch:
    inputs:
      requirements:
        description: "Paste requirements.txt contents (one package per line)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-wheelhouse:
    # Apple Silicon hosted runner. No project source code is checked out.
    runs-on: macos-14-xlarge
    steps:
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create requirements file
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          mkdir -p wheelhouse
          printf '%s\\n' "$REQUIREMENTS" > requirements.txt
          echo "Requested dependency lines:"
          grep -cve '^[[:space:]]*$' requirements.txt || true

      - name: Build wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --wheel-dir wheelhouse -r requirements.txt

      - name: Add environment manifest
        run: |
          python --version > wheelhouse/BUILD-INFO.txt
          uname -m >> wheelhouse/BUILD-INFO.txt
          sw_vers >> wheelhouse/BUILD-INFO.txt

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-py39-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 7
